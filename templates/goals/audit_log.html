{% extends 'base.html' %}
{% block content %}
<h2>Audit Log</h2>
<table>
    <tr><th>User</th><th>Action</th><th>Goal</th><th>Changes</th><th>Timestamp</th></tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.user.username }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.goal.title|default:'-' }}</td>
        <td>{{ log.changes|default:'-' }}</td>
        <td>{{ log.timestamp }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
